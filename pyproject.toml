[project]
name = "enterprise-ai-data-analyst"
version = "1.0.0"
description = "Enterprise AI Data Analyst & Business Intelligence Copilot"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.23",
    "duckdb>=0.9.2",
    "pandas>=2.1.3",
    "numpy>=1.26.2",
    "openpyxl>=3.1.0",
    "litellm>=1.40.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
    "aiofiles>=23.2.1",
    "requests>=2.31.0",
]

[tool.vercel]
runtime = "python"
entrypoint = "backend.app.main:app"
